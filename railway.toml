[deploy]
# Railway's current builder (Railpack) doesn't honor a Procfile "release:" line
# as a pre-deploy step, so migrations never ran with that alone. This field is
# Railway's first-class equivalent and does get executed before the new
# instance takes traffic.
preDeployCommand = "alembic upgrade head"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
